<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hyrule Compendium</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sheikah-blue: #00d1ff;
            --sheikah-glow: rgba(0, 209, 255, 0.5);
            --bg-dark: #0a0e17;
            --bubble-bg: rgba(20, 25, 40, 0.7);
            --text-main: #e0e6ed;
            --gold: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Nunito', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 209, 255, 0.1) 0%, transparent 50%),
                url('https://images.unsplash.com/photo-1506452814347-19597371d3ce?q=80&w=2000&auto=format&fit=crop'); /* Placeholder starry background */
            background-size: cover;
            background-attachment: fixed;
            background-blend-mode: overlay;
            overflow-x: hidden;
        }

        h1, h2, h3, .zelda-font {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- NAVIGATION --- */
        nav {
            width: 100%;
            padding: 20px 50px;
            background: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--sheikah-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            z-index: 100;
            box-shadow: 0 0 20px var(--sheikah-glow);
        }

        nav h1 {
            color: var(--sheikah-blue);
            font-size: 24px;
            text-shadow: 0 0 10px var(--sheikah-blue);
            cursor: pointer;
        }

        .menu {
            display: flex;
            gap: 30px;
        }

        .menu a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }

        .menu a:hover {
            color: var(--sheikah-blue);
            text-shadow: 0 0 8px var(--sheikah-blue);
        }

        /* --- HERO BANNER --- */
        #hero {
            height: 60vh;
            margin-top: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(to bottom, transparent, var(--bg-dark)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            border-bottom: 2px solid var(--gold);
        }

        #hero h1 {
            font-size: 5rem;
            color: var(--gold);
            text-shadow: 2px 2px 15px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }

        /* --- TIMELINE CONTAINER --- */
        #main-content {
            padding: 50px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
            padding-top: 20px;
        }

        /* --- MODERN BUBBLE CARDS --- */
        .game-card {
            background: var(--bubble-bg);
            border-radius: 25px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: var(--sheikah-blue);
            box-shadow: 0 15px 40px var(--sheikah-glow);
        }

        .game-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .game-card h3 {
            color: var(--gold);
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .game-card p {
            font-size: 1rem;
            line-height: 1.5;
            color: #b0b8c4;
        }

        /* --- DEEP DIVE VIEW (Hidden by default) --- */
        #deep-dive {
            display: none;
            padding-top: 100px;
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease;
        }

        .dive-header {
            display: flex;
            gap: 40px;
            background: var(--bubble-bg);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid var(--sheikah-blue);
            box-shadow: 0 0 30px var(--sheikah-glow);
            margin-bottom: 40px;
        }

        .dive-header img {
            width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .dive-info h2 {
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .dive-info p {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .dive-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .dive-section {
            background: var(--bubble-bg);
            border-radius: 25px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .dive-section h3 {
            color: var(--sheikah-blue);
            border-bottom: 1px solid var(--sheikah-blue);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .dive-section ul {
            list-style-type: none;
        }

        .dive-section li {
            margin-bottom: 15px;
            padding-left: 20px;
            position: relative;
        }

        .dive-section li::before {
            content: '▶';
            position: absolute;
            left: 0;
            color: var(--gold);
            font-size: 0.8rem;
            top: 5px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: transparent;
            color: var(--sheikah-blue);
            border: 1px solid var(--sheikah-blue);
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--sheikah-blue);
            color: #000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav>
        <h1 onclick="showTimeline()">Hyrule Archives</h1>
        <div class="menu">
            <a onclick="showTimeline()">Timeline</a>
            <a href="#">Interactive Maps</a>
            <a href="#">Settings</a>
        </div>
    </nav>

    <div id="home-view">
        <section id="hero">
            <h1>The Legend of Zelda</h1>
            <p class="zelda-font" style="font-size: 1.5rem; color: #fff;">A comprehensive visual timeline</p>
        </section>

        <section id="main-content">
            <h2 style="font-size: 2.5rem; border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 30px;">Historical Timeline</h2>
            <div class="timeline-grid" id="timeline-container">
                </div>
        </section>
    </div>

    <div id="deep-dive">
        <button class="back-btn" onclick="showTimeline()">Return to Timeline</button>
        <div id="deep-dive-content">
            </div>
    </div>

        // --- RENDER FUNCTIONS ---

        function initTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';

            for (const [key, game] of Object.entries(zeldaDatabase)) {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => loadDeepDive(key);
                
                card.innerHTML = `
                    <img src="${game.coverImg}" alt="${game.title}">
                    <h3>${game.title} <span style="font-size: 0.8rem; color: var(--sheikah-blue);">(${game.year})</span></h3>
                    <p>${game.shortDesc}</p>
                `;
                container.appendChild(card);
            }
        }

        function loadDeepDive(gameKey) {
            const game = zeldaDatabase[gameKey];
            
            // Hide timeline, show dive
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('deep-dive').style.display = 'block';
            window.scrollTo(0, 0); // scroll to top

            const diveContent = document.getElementById('deep-dive-content');
            
            // Generate lists
            let mechanicsList = game.mechanics.map(m => `<li>${m}</li>`).join('');
            let itemsList = game.items.map(i => `<li>${i}</li>`).join('');

            diveContent.innerHTML = `
                <div class="dive-header">
                    <img src="${game.coverImg}" alt="${game.title}">
                    <div class="dive-info">
                        <h2>${game.title}</h2>
                        <h4 style="color: var(--sheikah-blue); margin-bottom: 20px;">${game.platform} | ${game.year}</h4>
                        <p>${game.longDesc}</p>
                    </div>
                </div>
                
                <div class="dive-grid">
                    <div class="dive-section">
                        <h3>Core Mechanics</h3>
                        <ul>${mechanicsList}</ul>
                    </div>
                    <div class="dive-section">
                        <h3>Notable Items</h3>
                        <ul>${itemsList}</ul>
                    </div>
                </div>
            `;
        }

        function showTimeline() {
            document.getElementById('deep-dive').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo(0, 0);
        }

        // Boot the website
        initTimeline();
    </script>
</body>
</html>
