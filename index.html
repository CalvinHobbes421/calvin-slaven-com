<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Classroom</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

header{
height:60px;
background:#1a1a1a;
display:flex;
align-items:center;
padding:0 15px;
border-bottom:1px solid #2c2c2c;
gap:10px;
}

.title{
font-size:22px;
font-weight:bold;
margin-right:20px;
}

.tab{
padding:8px 16px;
background:#2a2a2a;
border-radius:8px;
cursor:pointer;
}

.tab.active{
background:#4285f4;
}

.page{
display:none;
flex:1;
overflow:hidden;
}

.page.active{
display:flex;
}

#executePage{
flex-direction:column;
}

.controls{
background:#191919;
padding:10px;
display:flex;
gap:10px;
border-bottom:1px solid #2c2c2c;
}

button{
background:#4285f4;
border:none;
color:white;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#5f97ff;
}

.runner{
display:flex;
flex:1;
overflow:hidden;
}

.editorPane{
width:50%;
border-right:1px solid #2c2c2c;
}

.outputPane{
width:50%;
}

#editor{
width:100%;
height:100%;
background:#181818;
color:#00ff88;
border:none;
outline:none;
resize:none;
padding:15px;
font-family:monospace;
}

iframe{
width:100%;
height:100%;
border:none;
background:white;
}

#codePage{
flex-direction:column;
}

.slotBar{
background:#1a1a1a;
padding:10px;
display:flex;
align-items:center;
gap:6px;
border-bottom:1px solid #2c2c2c;
}

.slot{
background:#2a2a2a;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
}

.slot.active{
background:#4285f4;
}

.spacer{
flex:1;
}

.storage{
flex:1;
}

.storage textarea{
width:100%;
height:100%;
background:#181818;
color:#00ff88;
border:none;
outline:none;
resize:none;
padding:15px;
font-family:monospace;
}
</style>
</head>
<body>

<header>
<div class="title">Google Classroom</div>

<div class="tab active" onclick="openPage('executePage',this)">
Execute
</div>

<div class="tab" onclick="openPage('codePage',this)">
Code
</div>
</header>

<div id="executePage" class="page active">

<div class="controls">
<button onclick="runCode()">Run</button>
<button onclick="toggleFullscreen()">Fullscreen</button>
</div>

<div class="runner">

<div class="editorPane">
<textarea id="editor"></textarea>
</div>

<div class="outputPane">
<iframe id="output"></iframe>
</div>

</div>

</div>

<div id="codePage" class="page">

<div class="slotBar">

<div class="slot active" onclick="switchSlot(1,this)">1</div>
<div class="slot" onclick="switchSlot(2,this)">2</div>
<div class="slot" onclick="switchSlot(3,this)">3</div>
<div class="slot" onclick="switchSlot(4,this)">4</div>
<div class="slot" onclick="switchSlot(5,this)">5</div>
<div class="slot" onclick="switchSlot(6,this)">6</div>
<div class="slot" onclick="switchSlot(7,this)">7</div>
<div class="slot" onclick="switchSlot(8,this)">8</div>
<div class="slot" onclick="switchSlot(9,this)">9</div>
<div class="slot" onclick="switchSlot(10,this)">10</div>

<div class="spacer"></div>

<button onclick="copyAll()">Copy All</button>

</div>

<div class="storage">
<textarea id="vault"></textarea>
</div>

</div>

<script>

let currentSlot = 1;

function openPage(id,el){

document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active");
});

document.querySelectorAll("header .tab").forEach(t=>{
t.classList.remove("active");
});

document.getElementById(id).classList.add("active");
el.classList.add("active");

}

function runCode(){

const code =
document.getElementById("editor").value;

document.getElementById("output").srcdoc = code;

localStorage.setItem(
"executeEditor",
code
);

}

function toggleFullscreen(){

const frame =
document.getElementById("output");

if(!document.fullscreenElement){
frame.requestFullscreen();
}else{
document.exitFullscreen();
}

}

function saveSlot(){

localStorage.setItem(
"slot_" + currentSlot,
document.getElementById("vault").value
);

}

function switchSlot(number,el){

saveSlot();

currentSlot = number;

document.querySelectorAll(".slot").forEach(slot=>{
slot.classList.remove("active");
});

el.classList.add("active");

document.getElementById("vault").value =
localStorage.getItem("slot_" + number) || "";

}

function copyAll(){

navigator.clipboard.writeText(
document.getElementById("vault").value
);

}

document.getElementById("vault")
.addEventListener("input",saveSlot);

document.getElementById("editor")
.addEventListener("input",()=>{

localStorage.setItem(
"executeEditor",
document.getElementById("editor").value
);

});

document.getElementById("editor").value =
localStorage.getItem("executeEditor") || "";

document.getElementById("vault").value =
localStorage.getItem("slot_1") || "";

</script>

</body>
</html>
