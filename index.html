<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Execcute</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
background:#111;
color:white;
font-family:Arial;
}

#left{
width:50%;
display:flex;
flex-direction:column;
}

#right{
width:50%;
position:relative;
}

textarea{
flex:1;
background:#1a1a1a;
color:#00ff88;
border:none;
outline:none;
padding:15px;
resize:none;
font-family:monospace;
font-size:14px;
}

.controls{
padding:10px;
display:flex;
gap:10px;
background:#181818;
}

button{
padding:10px 15px;
border:none;
background:#333;
color:white;
cursor:pointer;
border-radius:6px;
}

button:hover{
background:#555;
}

iframe{
width:100%;
height:100%;
border:none;
background:white;
}
</style>
</head>
<body>

<div id="left">

<div class="controls">
<button onclick="runCode()">Run</button>
<button onclick="goFull()">Fullscreen</button>
</div>

<textarea id="editor">
<!DOCTYPE html>
<html>
<body style="background:black;color:white;text-align:center;">
<h1>Hello World</h1>
<button onclick="alert('works')">Click Me</button>
</body>
</html>
</textarea>

</div>

<div id="right">
<iframe id="output"></iframe>
</div>

<script>
function runCode(){
const code=document.getElementById("editor").value;
document.getElementById("output").srcdoc=code;
}

function goFull(){
const frame=document.getElementById("output");

if(!document.fullscreenElement){
frame.requestFullscreen();
}else{
document.exitFullscreen();
}
}

runCode();
</script>

</body>
</html>
