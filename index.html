<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calvin's Retro Hub</title>
    <style>
        body { 
            background-color: #080808; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #080808 60%);
        }
        
        #header { 
            width: 100%; 
            padding: 30px 20px; 
            text-align: center; 
            border-bottom: 1px solid #d4af37; 
            box-shadow: 0 4px 25px rgba(212, 175, 55, 0.1); 
            background: rgba(10, 10, 10, 0.8);
        }
        
        h1 { 
            margin: 0; 
            font-size: 2.8em; 
            text-transform: uppercase; 
            letter-spacing: 6px; 
            color: #d4af37; /* Zelda Gold */
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4); 
        }
        
        .subtitle { 
            color: #888; 
            font-size: 1.2em; 
            margin-top: 10px; 
            letter-spacing: 2px;
        }
        
        #game-wrapper { 
            width: 85%; 
            max-width: 1400px; 
            height: 75vh; 
            margin-top: 40px; 
            border: 1px solid #333; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.9); 
            background: #000; 
        }
        
        .instructions { 
            margin-top: 25px;
            max-width: 700px; 
            text-align: center; 
            color: #666; 
            line-height: 1.6; 
            font-size: 1.1em;
        }
        
        .highlight { color: #d4af37; font-weight: bold; }
    </style>
</head>
<body>
    <div id="header">
        <h1>Hyrule Web Terminal</h1>
        <div class="subtitle">Direct-to-Browser Hardware Emulation</div>
    </div>
    
    <div id="game-wrapper">
        <div style="width:100%;height:100%;max-width:100%">
            <div id="game"></div>
        </div>
    </div>

    <div class="instructions">
        <p>System is ready. Click the folder icon in the center of the screen to load a local ROM file from your PC.</p>
        <p>Currently configured for N64 (<span class="highlight">.z64, .n64</span>). Full gamepad support is automatically enabled.</p>
    </div>

    <script>
        EJS_player = '#game';
        EJS_biosUrl = ''; 
        EJS_gameUrl = ''; // Left blank intentionally so you can upload your own local files
        EJS_core = 'n64'; // Booting the N64 core
        EJS_pathtodata = 'https://raw.githack.com/EmulatorJS/EmulatorJS/main/data/';
    </script>
    <script src="https://raw.githack.com/EmulatorJS/EmulatorJS/main/data/loader.js"></script>
</body>
</html>
