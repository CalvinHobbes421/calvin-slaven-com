<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Classroom</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

header{
height:55px;
background:#1a1a1a;
display:flex;
align-items:center;
padding:0 15px;
border-bottom:1px solid #2d2d2d;
gap:10px;
}

.title{
font-size:20px;
font-weight:bold;
}

.tab{
padding:8px 16px;
background:#2a2a2a;
border-radius:8px;
cursor:pointer;
user-select:none;
}

.tab.active{
background:#4285f4;
}

.page{
flex:1;
display:none;
height:calc(100vh - 55px);
}

.page.active{
display:flex;
}

#codePage{
padding:10px;
}

textarea{
width:100%;
height:100%;
background:#1b1b1b;
color:#00ff88;
border:none;
outline:none;
resize:none;
padding:15px;
font-family:monospace;
font-size:14px;
}

#runPage{
flex-direction:column;
}

.controls{
padding:10px;
background:#191919;
display:flex;
gap:10px;
}

button{
background:#4285f4;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#5d95f5;
}

iframe{
flex:1;
width:100%;
border:none;
background:white;
}
</style>
</head>
<body>

<header>
<div class="title">Google Classroom</div>

<div class="tab active" onclick="showTab('runPage',this)">
Execute
</div>

<div class="tab" onclick="showTab('codePage',this)">
Code
</div>
</header>

<div id="runPage" class="page active">

<div class="controls">
<button onclick="runStuff()">Run</button>
<button onclick="fullscreenStuff()">Fullscreen</button>
</div>

<iframe id="screen"></iframe>

</div>

<div id="codePage" class="page">

<textarea id="storedCode">

<!DOCTYPE html>
<html>
<body style="background:black;color:white;text-align:center;">
<h1>Game Loaded</h1>

<button onclick="alert('hello')">
Start
</button>

</body>
</html>

</textarea>

</div>

<script>

function showTab(id,element){

document.querySelectorAll(".page").forEach(page=>{
page.classList.remove("active");
});

document.querySelectorAll(".tab").forEach(tab=>{
tab.classList.remove("active");
});

document.getElementById(id).classList.add("active");
element.classList.add("active");

}

function runStuff(){

const code =
document.getElementById("storedCode").value;

document.getElementById("screen").srcdoc = code;

}

function fullscreenStuff(){

const frame =
document.getElementById("screen");

if(!document.fullscreenElement){
frame.requestFullscreen();
}else{
document.exitFullscreen();
}

}

runStuff();

</script>

</body>
</html>
